name: " 🧪 build-test"
on: # rebuild any PRs and main branch changes
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  download-vscode:
    runs-on: ubuntu-latest
    outputs:
      download_result: ${{ steps.download.outputs.download_result }}
      vscode_path: ${{ fromJson(steps.download.outputs.download_result).vscodeExecutablePath }}
      vscode_version: ${{ steps.vscode-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      # Resolve `stable` to an exact version so the cache key changes when a new version is released.
      # The cache also holds the Code Spell Checker extension, which is refreshed along with VSCode.
      - name: Get VSCode Version
        id: vscode-version
        run: |
          version=$(curl -fsSL --retry 3 https://update.code.visualstudio.com/api/releases/stable | jq -r '.[0]')
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::Unable to resolve the stable VSCode version."
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Download
        id: cache-download
        uses: actions/cache@v6.1.0
        with:
          # VSCode cache key: keep the same form in `build-test` and `test-windows`.
          key: vscode-download-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode-version.outputs.version }}
          path: .vscode-test

      - name: Install
        run: npm ci

      - name: Download
        id: download
        run: |
          # Assign first: a failing command substitution inside `echo` would not fail the step.
          result=$(node ./test-runner/download-vscode.mts --vscode-version ${{ steps.vscode-version.outputs.version }})
          echo "download_result=$result" >> $GITHUB_OUTPUT

      - name: Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: |
            ## Downloaded VSCode
            - Cache Key: vscode-download-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode-version.outputs.version }}
            - Cache Hit: ${{ toJson(steps.cache-download.outputs) }}
            - Download Result: ${{ steps.download.outputs.download_result }}
          # - Event:
          # ```json
          # ${{ toJson(github.event) }}
          # ```

  list_extensions:
    runs-on: ubuntu-latest
    outputs:
      extension_list: ${{ steps.get-extensions.outputs.extensions_from_script }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: From Script
        id: get-extensions
        run: |
          echo extensions_from_script=$(node ./scripts/list-extensions.mts) >> $GITHUB_OUTPUT

      - name: Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: |
            ### List Extensions
            ```
            ${{ steps.get-extensions.outputs.extensions_from_script }}
            ```

  build-test:
    runs-on: ubuntu-latest
    needs:
      - list_extensions
      - download-vscode
    strategy:
      fail-fast: false
      matrix:
        extension_dir: ${{ fromJSON(needs.list_extensions.outputs.extension_list) }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Cache Download
        id: cache-download
        uses: actions/cache@v6.1.0
        with:
          # VSCode cache key: keep the same form in `download-vscode` and `test-windows`.
          key: vscode-download-cache-${{ runner.os }}-${{ runner.arch }}-${{ needs.download-vscode.outputs.vscode_version }}
          path: .vscode-test
          fail-on-cache-miss: true

      - run: npm ci
      - run: |
          cd ${{ matrix.extension_dir }}
          npm run pack-extension
          npm run test:cspell

      - name: Run Test Linux
        if: runner.os == 'Linux'
        run: |
          cd ${{ matrix.extension_dir }}
          xvfb-run -a npm run test:vscode -- --vscode-path ${{ needs.download-vscode.outputs.vscode_path }}

  # Make sure one extension can be built, packaged and tested on Windows.
  # Uses the same VSCode version as the Linux tests.
  # This is a separate job rather than a `build-test` matrix entry because the setup differs: it installs only
  # what the test extension needs, needs its own VSCode download and cache, and runs without `xvfb-run`.
  test-windows:
    runs-on: windows-latest
    needs:
      - download-vscode
    env:
      VSCODE_VERSION: ${{ needs.download-vscode.outputs.vscode_version }}
      TEST_EXTENSION_DIR: extensions/german
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test-runner/package-lock.json
            ${{ env.TEST_EXTENSION_DIR }}/package-lock.json

      - name: Cache Download
        id: cache-download
        uses: actions/cache@v6.1.0
        with:
          # VSCode cache key: keep the same form in `download-vscode` and `build-test`.
          key: vscode-download-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.VSCODE_VERSION }}
          path: .vscode-test

      # Install only what the test extension needs. The root `postinstall` would install all extensions.
      - name: Install
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm ci --prefix test-runner
          npm ci --prefix "$TEST_EXTENSION_DIR"

      - name: Build and Package
        shell: bash
        working-directory: ${{ env.TEST_EXTENSION_DIR }}
        run: npm run pack-extension

      - name: Download
        id: download
        shell: bash
        run: |
          # Assign first: a failing command substitution inside `echo` would not fail the step.
          result=$(node ./test-runner/download-vscode.mts --vscode-version "$VSCODE_VERSION")
          echo "download_result=$result" >> $GITHUB_OUTPUT

      - name: Run Test Windows
        shell: bash
        working-directory: ${{ env.TEST_EXTENSION_DIR }}
        env:
          VSCODE_PATH: ${{ fromJson(steps.download.outputs.download_result).vscodeExecutablePath }}
        run: |
          npm run test:cspell
          npm run test:vscode -- --vscode-path "$VSCODE_PATH"

  # Run the spell checker on all the samples using the extension's settings.
  # This will help with dictionary updates.
  check-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
      - name: Check Samples
        run: |
          npm run test:cspell
