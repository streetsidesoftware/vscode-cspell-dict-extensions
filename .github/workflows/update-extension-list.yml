name: " 🔗 Update Extension Lists"

on:
  push:
    branches:
      - main

  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip the install-time audit: a hung audit request can stall an install for 5 minutes.
env:
  NPM_CONFIG_AUDIT: false

jobs:
  update-extension-lists:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      NEW_BRANCH: "update-extension-lists"
    steps:
      - name: Start
        run: |
          echo "${{ toJson(github.event.inputs) }}"
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the Config Schema
        run: npm run build
        working-directory: extension-runtime

      - name: Update Workspace
        run: |
          npm run gen:readme

      - name: Update Release Please Packages
        run: |
          npm run gen:release-please

      - name: Update Workflow Extension Lists
        run: |
          npm run gen:workflow

      - name: PR Body
        id: pr-body
        uses: streetsidesoftware/actions/public/pr-body@v1
        with:
          title: "ci: Update README, Extension Lists and Config Schema"
          message: |
            Update README / Extensions List with any new extensions that have been added to the marketplace, and rebuild the extension config schema.
          path: >-
            README.md
            extension-runtime/extension.config.schema.json

      # Uses the automation app because GITHUB_TOKEN cannot push changes to `.github/workflows/`.
      - name: Create PR
        uses: streetsidesoftware/actions/.github/actions/pr@v1
        with:
          commit-message: "ci: Update README, Extension Lists and Config Schema"
          branch: ${{ env.NEW_BRANCH }}
          base: main
          title: "ci: Update README, Extension Lists and Config Schema"
          body: ${{ steps.pr-body.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
