name: " 🧽 Lint"

on: # rebuild any PRs and main branch changes
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its older run. Other runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Skip the install-time audit: a hung audit request can stall an install for 5 minutes.
env:
  NPM_CONFIG_AUDIT: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run check-types
      - run: npm run lint:code
      - name: Check the extensions
        run: npm run check:extensions
