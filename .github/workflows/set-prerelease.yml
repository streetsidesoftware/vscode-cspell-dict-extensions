name: " 👀 Set Prerelease"

# Opens a PR that turns an extension's pre-release mode on or off.
# While it is on, every release of the extension is published as a pre-release.
# Turning it off is a `fix:` commit, so the next release is a stable version above the pre-releases.
# Modeled on `set-prerelease.yml` in streetsidesoftware/vscode-spell-checker.

on:
  workflow_dispatch:
    inputs:
      extension:
        description: The extension
        type: choice
        required: true
        # Options are generated from `npm run gen:workflow`
        options:
          - ancient-greek
          - arabic
          - armenian
          - australian-english
          - austrian-german
          - azerbaijani
          - basque
          - belarusian
          - british-english
          - british-english-ise
          - bulgarian
          - canadian-english
          - catalan
          - croatian
          - cspell-bundled-dictionaries
          - czech
          - danish
          - dutch
          - esperanto
          - estonian
          - finnish
          - french
          - french-reforme
          - galician
          - german
          - greek
          - hebrew
          - hungarian
          - hunspell-syntax
          - indonesian
          - italian
          - latin
          - latvian
          - lithuanian
          - macedonian
          - medical-terms
          - mongolian
          - norwegian-bokmal
          - persian
          - polish
          - portuguese
          - portuguese-brazilian
          - romanian
          - russian
          - scientific-terms
          - serbian
          - slovak
          - slovenian
          - spanish
          - swedish
          - swiss-german
          - timestamp-hover
          - turkish
          - ukrainian
          - vietnamese
          - win32
      prerelease:
        description: Is prerelease?
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  set-prerelease-mode:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      EXTENSION: ${{ inputs.extension }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Set Mode
        run: node ./extension-tools/set-prerelease-mode.mts "$EXTENSION" "$PRERELEASE"

      - name: PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: >-
            ${{
              inputs.prerelease
              && format('chore({0}): Set Prerelease Mode to true', inputs.extension)
              || format('fix({0}): Prepare for Release', inputs.extension)
            }}
          branch: update-prerelease-mode-${{ inputs.extension }}
          base: main
          title: >-
            ${{
              inputs.prerelease
              && format('chore({0}): Set Prerelease Mode to true', inputs.extension)
              || format('fix({0}): Prepare for Release', inputs.extension)
            }}
          body: |
            # Prerelease Mode

            Set the pre-release mode of `extensions/${{ inputs.extension }}` to `${{ inputs.prerelease }}`.
          token: ${{ secrets.GITHUB_TOKEN }}
