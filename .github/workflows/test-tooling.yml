name: " 🧪 Test Tooling"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "extension-runtime/**"
      - "extension-tools/**"
      - "scripts/**"
      - ".tool-versions"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/test-tooling.yml"
  push:
    branches:
      - main
    paths:
      - "extension-runtime/**"
      - "extension-tools/**"
      - "scripts/**"
      - ".tool-versions"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/test-tooling.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip the install-time audit: a hung audit request can stall an install for 5 minutes.
env:
  NPM_CONFIG_AUDIT: false

jobs:
  test-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      # The root `postinstall` would install all extensions. The tests only need the root, `scripts/` and
      # `extension-tools/` packages: the scripts import extension-tools.
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix scripts
          npm ci --prefix extension-tools
      - name: Test scripts
        run: npm test
        working-directory: scripts
