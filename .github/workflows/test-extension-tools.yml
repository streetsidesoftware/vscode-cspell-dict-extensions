name: " 🧪 Test Extension Tools"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "extension-tools/**"
      - "extension-runtime/**"
      - ".tool-versions"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/test-extension-tools.yml"
  push:
    branches:
      - main
    paths:
      - "extension-tools/**"
      - "extension-runtime/**"
      - ".tool-versions"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/test-extension-tools.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Skip the install-time audit: a hung audit request can stall an install for 5 minutes.
env:
  NPM_CONFIG_AUDIT: false

jobs:
  test-extension-tools:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension-tools/package-lock.json
      # The root `postinstall` would install all extensions. The tests only need the root and `extension-tools/` packages.
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix extension-tools
      - run: npm test
        working-directory: extension-tools
