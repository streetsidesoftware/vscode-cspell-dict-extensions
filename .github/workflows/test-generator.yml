name: " 🧪 Test Generator"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "generator-cspell-dicts-extensions/**"
      - ".github/workflows/test-generator.yml"
  push:
    branches:
      - main
    paths:
      - "generator-cspell-dicts-extensions/**"
      - ".github/workflows/test-generator.yml"

jobs:
  test-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm test
        working-directory: generator-cspell-dicts-extensions
